name: Build apps

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: PrP-Path-Fixer-mac.zip
          - os: windows-latest
            asset: PrP-Path-Fixer-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm packaging/prp_path_fixer.spec

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir out
          cp -R "dist/PrP Path Fixer.app" out/
          cp app/PrP-Path-Fixer.html out/
          # 署名なしアプリでも起動できるよう ad-hoc 署名
          codesign --force --deep --sign - "out/PrP Path Fixer.app"
          ditto -c -k --keepParent out "${{ matrix.asset }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item dist/PrP-Path-Fixer.exe out/
          Copy-Item app/PrP-Path-Fixer.html out/
          Compress-Archive -Path out/* -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PrP-Path-Fixer-mac.zip
            PrP-Path-Fixer-windows.zip
